[workspace]
authors = ["Ahmad Bassam El Bizri <34858431+1ahmadbassam@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojocudatest"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# -I .             : root package (Framework, MojoBridge, DataFormats, Bin, CUDACORE)
# -I CUDACORE/cms/CUDA : flat imports inside the CUDA subsystem
# -I plugin-Test1  : IntESProducer, TestProducer, gpuAlgo1 (directory name has a hyphen)
run-test1 = { cmd = "mojo run -I . -I CUDACORE/cms/CUDA -I CUDACORE/cms/notcub -I CUDACORE/cms/CUDA/allocator -I plugin-Test1 main.mojo --data /tmp/cudatest-data --warmupEvents 2 --maxEvents 100" }

[dependencies]
max = ">=25.3"
